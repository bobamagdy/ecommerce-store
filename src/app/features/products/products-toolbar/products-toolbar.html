<div class="products-toolbar">
  <p class="results-count" aria-live="polite">
    Showing

    <strong>
      {{ displayedCount() }}
    </strong>

    of

    <strong>
      {{ totalCount() }}
    </strong>

    products
  </p>

  <div class="toolbar-actions">
    <div class="sort-control">
      <span>Sort by:</span>

      <app-product-sort-select [value]="sortBy()" (valueChange)="sortChange.emit($event)" />
    </div>

    <div
      ngToolbar
      class="view-buttons"
      aria-label="Product display controls"
      orientation="horizontal"
      [wrap]="true"
      [value]="selectedViews()"
      (valueChange)="onSelectedViewsChange($event)"
    >
      <span class="view-label" aria-hidden="true"> View: </span>

      <div
        ngToolbarWidgetGroup
        role="radiogroup"
        class="view-button-group"
        aria-label="Product view options"
      >
        <button
          #gridWidget="ngToolbarWidget"
          ngToolbarWidget
          type="button"
          role="radio"
          value="grid"
          class="view-button"
          [class.active]="gridWidget.selected()"
          [attr.aria-checked]="gridWidget.selected()"
          aria-label="Grid view"
        >
          <i class="pi pi-th-large" aria-hidden="true"></i>
        </button>

        <button
          #listWidget="ngToolbarWidget"
          ngToolbarWidget
          type="button"
          role="radio"
          value="list"
          class="view-button"
          [class.active]="listWidget.selected()"
          [attr.aria-checked]="listWidget.selected()"
          aria-label="List view"
        >
          <i class="pi pi-list" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</div>
