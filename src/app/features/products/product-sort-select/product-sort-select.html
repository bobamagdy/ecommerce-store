<div
  #combobox="ngCombobox"
  ngCombobox
  class="sort-select-trigger"
  aria-label="Sort products"
  [(expanded)]="popupExpanded"
  [preserveContent]="true"
>
  <span class="selected-sort-value">
    {{ selectedLabel() }}
  </span>

  <i class="pi pi-chevron-down select-arrow" aria-hidden="true"></i>
</div>

<ng-template
  [cdkConnectedOverlay]="{
    origin: combobox.element,
    usePopover: 'inline',
    matchWidth: true,
  }"
  [cdkConnectedOverlayOpen]="popupExpanded()"
  (overlayOutsideClick)="closePopup()"
  (detach)="closePopup()"
>
  <ng-template ngComboboxPopup [combobox]="combobox">
    <div class="sort-select-popup">
      <div
        #listbox="ngListbox"
        ngListbox
        ngComboboxWidget
        class="sort-options-list"
        aria-label="Product sorting options"
        focusMode="activedescendant"
        selectionMode="explicit"
        [tabindex]="-1"
        [activeDescendant]="listbox.activeDescendant()"
        [(value)]="selectedValues"
        (click)="commitSelection()"
        (keydown.enter)="commitSelection()"
        (keydown.space)="commitSelection()"
      >
        @for (option of options; track option.value) {
          <div ngOption class="sort-option" [value]="option.value" [label]="option.label">
            <span class="sort-option-label">
              {{ option.label }}
            </span>

            <i class="pi pi-check selected-check" aria-hidden="true"></i>
          </div>
        }
      </div>
    </div>
  </ng-template>
</ng-template>
