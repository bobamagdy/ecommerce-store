<main class="not-found-page">

  <section class="not-found-card">

    <div
      class="error-number"
      aria-hidden="true"
    >
      404
    </div>

    <div class="error-icon">

      <i
        class="pi pi-map-marker"
        aria-hidden="true"
      ></i>

    </div>

    <p class="error-label">
      PAGE NOT FOUND
    </p>

    <h1>
      This page doesn’t exist
    </h1>

    <p class="error-description">
      The page you are looking for may have
      been removed, renamed, or is temporarily
      unavailable.
    </p>

    <div class="error-actions">

      <a
        class="home-button"
        routerLink="/"
      >
        <i
          class="pi pi-home"
          aria-hidden="true"
        ></i>

        <span>
          Back to Home
        </span>
      </a>

      <a
        class="products-button"
        routerLink="/products"
      >
        <i
          class="pi pi-shopping-bag"
          aria-hidden="true"
        ></i>

        <span>
          Browse Products
        </span>
      </a>

    </div>

  </section>

</main>
